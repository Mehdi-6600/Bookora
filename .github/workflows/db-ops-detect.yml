name: DB Ops — detect (read-only)

# Read-only diagnostic: confirms that a Production database credential is
# reachable, identifies the target without exposing it, and reports the current
# state of prisma/sql/0006_bot_starts_unique.sql plus the outreach switches.
#
# It never writes: no DDL, no DML, no switch change. It fails (instead of
# reporting a green run) whenever it cannot actually verify the database, so a
# green result always means "these facts were read from the real database".
#
# Use db-ops-apply.yml to actually apply the migration.

on:
  workflow_dispatch:

# Read-only, but never run two inspections against Production at once.
concurrency:
  group: db-ops-0006
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  detect:
    name: detect credential and 0006 state
    runs-on: ubuntu-latest
    environment: Production
    env:
      C_DIRECT: ${{ secrets.DIRECT_URL }}
      C_DATABASE: ${{ secrets.DATABASE_URL }}
      C_POSTGRES: ${{ secrets.POSTGRES_URL }}
      C_NEON: ${{ secrets.NEON_DATABASE_URL }}
      C_PROD: ${{ secrets.PRODUCTION_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read-only inspection
        run: |
          set -uo pipefail
          R=/tmp/report.txt; : > "$R"
          OUT=/tmp/outcome; echo "PENDING" > "$OUT"
          say() { printf '%s\n' "$*" | tee -a "$R"; }
          red() { sed -e "s|${PGHOST:-__no_host__}|[db-host]|g" -e 's|://[^:/@]*:[^@]*@|://***:***@|g'; }
          finish() { echo "$1" > "$OUT"; say ""; say "**OUTCOME: \`$1\`**"; exit 0; }

          say "## 1. Credential availability (presence only — values are never read into the log)"
          for pair in "DIRECT_URL:C_DIRECT" "DATABASE_URL:C_DATABASE" "POSTGRES_URL:C_POSTGRES" "NEON_DATABASE_URL:C_NEON" "PRODUCTION_DATABASE_URL:C_PROD"; do
            name=${pair%%:*}; ref=${pair##*:}
            if [ -n "${!ref:-}" ]; then say "- \`$name\`: **PRESENT**"; else say "- \`$name\`: absent"; fi
          done

          URL="${C_DIRECT:-}"; [ -n "$URL" ] || URL="${C_DATABASE:-}"; [ -n "$URL" ] || URL="${C_POSTGRES:-}"
          [ -n "$URL" ] || URL="${C_NEON:-}"; [ -n "$URL" ] || URL="${C_PROD:-}"
          if [ -z "$URL" ]; then
            say ""
            say "**No database credential is configured for GitHub Actions.** Repository scope and environment"
            say "\`Production\` were both checked. Nothing was connected to and nothing was modified."
            say ""
            say "Minimal enabler: add a repository secret named \`DIRECT_URL\` (Neon direct / unpooled string)."
            finish NO_CREDENTIAL
          fi

          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          __DBURL__="$URL" python3 - > /tmp/pg_env.sh <<'PY'
          import os, urllib.parse, shlex
          u = urllib.parse.urlparse(os.environ["__DBURL__"])
          for k, v in {
              "PGHOST": u.hostname or "", "PGPORT": str(u.port or 5432),
              "PGUSER": urllib.parse.unquote(u.username or ""),
              "PGPASSWORD": urllib.parse.unquote(u.password or ""),
              "PGDATABASE": (u.path or "/").lstrip("/"), "PGSSLMODE": "require",
          }.items():
              print(f"export {k}={shlex.quote(v)}")
          PY
          # shellcheck disable=SC1091
          . /tmp/pg_env.sh
          say ""
          say "credential loaded into PG* environment variables (value never printed)"
          q() { psql -X -q -A -F'|' -P pager=off -v ON_ERROR_STOP=1 -c "$1" 2>&1 | red | tee -a "$R"; }
          qt() { psql -X -A -t -c "$1" 2>/dev/null; }
          if ! qt "select 1;" >/dev/null 2>&1; then
            say ""
            say "**The credential could not connect — no facts could be read.**"
            finish CONNECT_FAILED
          fi

          say ""
          say "## 2. Target identity (masked)"
          say ""
          say '```'
          q "select 'database' k, current_database() v
             union all select 'is_replica', pg_is_in_recovery()::text
             union all select 'server_addr_hash12', substr(md5(inet_server_addr()::text),1,12)
             union all select 'server_port', inet_server_port()::text
             union all select 'pg_version', (select setting from pg_settings where name='server_version')
             union all select 'pg_started', pg_postmaster_start_time()::text;"
          q "select name, setting from pg_settings where name like 'neon%' order by name limit 20;"
          say '```'

          say ""
          say "## 3. Data fingerprint"
          say ""
          say '```'
          q "select 'users' k, count(*)::text v from users
             union all select 'businesses', count(*)::text from businesses
             union all select 'bookings', count(*)::text from bookings
             union all select 'bot_starts' , count(*)::text from bot_starts;"
          say '```'

          say ""
          say "## 4. Migration 0006 state"
          say ""
          say '```'
          q "select 'updateId column' k, case when exists (select 1 from information_schema.columns
                where table_schema='public' and table_name='bot_starts' and column_name='updateId')
                then 'PRESENT' else 'MISSING' end v;"
          q "select indexname, case when indexdef ilike '%unique%' then 'UNIQUE' else 'non-unique' end
               from pg_indexes where schemaname='public' and tablename='bot_starts' order by 1;"
          q "select 'duplicate (telegramId,startParam) groups' k, count(*)::text v from (
                select 1 from bot_starts where \"startParam\" is not null
                 group by \"telegramId\",\"startParam\" having count(*) > 1) d;"
          say '```'

          say ""
          say "## 5. Outreach switches (read-only; nothing is changed)"
          say ""
          say '```'
          q "select key, value from admin_settings
              where key in ('outreach.enabled','outreach.auto_send_enabled') order by key;"
          q "select 'admin_settings rows with outreach.% key' k, count(*)::text v from admin_settings where key like 'outreach.%';"
          say '```'

          say ""
          say "## 6. Concurrent sessions"
          say ""
          say '```'
          q "select count(*)::text as other_sessions from pg_stat_activity where pid <> pg_backend_pid();"
          say '```'
          finish DETECTED

      - name: Publish findings
        if: always()
        run: |
          REPORT=$(cat /tmp/report.txt 2>/dev/null || echo "no findings collected")
          OUTCOME=$(cat /tmp/outcome 2>/dev/null || echo "NO_OUTCOME")
          {
            echo '{"name":"DB 0006 readiness","head_sha":"'"$GITHUB_SHA"'","status":"completed","conclusion":"neutral","output":'
            printf '%s' "$REPORT" | jq -Rs --arg o "$OUTCOME" '{title:("Bookora DB readiness — outcome: " + $o), summary:.}'
            echo '}'
          } > /tmp/payload.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/payload.json >/dev/null && echo "check run published"

      - name: Enforce outcome (a green run must mean the facts were really read)
        if: always()
        run: |
          OUTCOME=$(cat /tmp/outcome 2>/dev/null || echo "NO_OUTCOME")
          case "$OUTCOME" in
            DETECTED) echo "outcome DETECTED — facts were read from the database"; exit 0 ;;
            *) echo "::error::detect ended as $OUTCOME — see the check-run summary"; exit 1 ;;
          esac
