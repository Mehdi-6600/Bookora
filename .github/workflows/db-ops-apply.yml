name: DB Ops — 0006 apply + verify (gated)

# Applies prisma/sql/0006_bot_starts_unique.sql to the Production database and
# verifies the result directly against that database — but only when every gate
# passes. The run is never reported as successful unless the change was really
# made and really verified.
#
#   mode=verify-only (default): read-only. Reports identity, fingerprint and the
#                               0006 state. Writes nothing, ever.
#   mode=apply               : additionally requires confirm=APPLY-0006, then
#                               backs up, applies the migration and verifies it.
#
# Gates before any write: credential present, target is a primary holding real
# production data, bot_starts exists, a backup was produced AND proven
# restorable, and zero duplicate (telegramId, startParam) groups exist.
#
# The workflow never prints a connection string, never uploads personal data,
# never deletes or rewrites a row, and never changes an outreach switch or a
# consent record. Any failure — credential absent, identity unverifiable, gates
# not met, migration error, verification mismatch — ends the run as a FAILURE.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify-only (read-only) or apply (apply 0006 after all gates pass)"
        type: choice
        options: [verify-only, apply]
        default: verify-only
        required: true
      confirm:
        description: 'Type exactly APPLY-0006 to permit mode=apply. Ignored for verify-only.'
        type: string
        default: ""

# Never let two migration runs overlap, and never cancel one mid-flight.
concurrency:
  group: db-ops-0006
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  gated:
    name: gated 0006 operation
    runs-on: ubuntu-latest
    environment: Production
    env:
      C_DIRECT: ${{ secrets.DIRECT_URL }}
      C_DATABASE: ${{ secrets.DATABASE_URL }}
      C_POSTGRES: ${{ secrets.POSTGRES_URL }}
      C_NEON: ${{ secrets.NEON_DATABASE_URL }}
      C_PROD: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Gated operation (read-only unless mode=apply and every gate passes)
        run: |
          set -uo pipefail
          R=/tmp/report.txt; : > "$R"
          OUT=/tmp/outcome; echo "PENDING" > "$OUT"

          say() { printf '%s\n' "$*" | tee -a "$R"; }
          # Redaction: the connection string is never printed, and the host and any
          # user:password pair are stripped from anything that is echoed.
          red() { sed -e "s|${PGHOST:-__no_host__}|[db-host]|g" -e 's|://[^:/@]*:[^@]*@|://***:***@|g'; }
          finish() {
            echo "$1" > "$OUT"
            say ""
            say "**OUTCOME: \`$1\`**"
            exit 0
          }
          say "mode: \`$MODE\`"

          # ── Gate 1: a credential must exist ──────────────────────────────────
          URL="${C_DIRECT:-}"; [ -n "$URL" ] || URL="${C_DATABASE:-}"; [ -n "$URL" ] || URL="${C_POSTGRES:-}"
          [ -n "$URL" ] || URL="${C_NEON:-}"; [ -n "$URL" ] || URL="${C_PROD:-}"
          if [ -z "$URL" ]; then
            say ""
            say "## BLOCKED — no database credential"
            say "Repository scope and environment \`Production\` were both checked. Nothing was connected to and nothing was modified."
            say ""
            say "Minimal enabler: add a repository secret named \`DIRECT_URL\` (Neon direct / unpooled"
            say "connection string). The value never has to be shared with anyone."
            finish NO_CREDENTIAL
          fi
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "APPLY-0006" ]; then
            say ""
            say "## BLOCKED — mode=apply requires confirm=APPLY-0006"
            finish APPLY_NOT_CONFIRMED
          fi
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq postgresql-client >/dev/null; }

          # Split the credential into PG* variables. The value is passed through
          # the environment only and is never written to the log.
          __DBURL__="$URL" python3 - > /tmp/pg_env.sh <<'PY'
          import os, urllib.parse, shlex
          u = urllib.parse.urlparse(os.environ["__DBURL__"])
          vals = {
              "PGHOST": u.hostname or "",
              "PGPORT": str(u.port or 5432),
              "PGUSER": urllib.parse.unquote(u.username or ""),
              "PGPASSWORD": urllib.parse.unquote(u.password or ""),
              "PGDATABASE": (u.path or "/").lstrip("/"),
              "PGSSLMODE": "require",
          }
          for k, v in vals.items():
              print(f"export {k}={shlex.quote(v)}")
          PY
          # shellcheck disable=SC1091
          . /tmp/pg_env.sh
          say "credential: loaded into PG* environment variables (value never printed)"

          q() { psql -X -q -A -F'|' -P pager=off -v ON_ERROR_STOP=1 -c "$1" 2>&1 | red | tee -a "$R"; }
          qt() { psql -X -A -t -c "$1" 2>/dev/null; }   # scalar, not echoed
          if ! qt "select 1;" >/dev/null 2>&1; then
            say ""
            say "## BLOCKED — the credential could not connect or is not usable"
            qt "select 1;" 2>&1 | red | tee -a "$R" >/dev/null
            finish CONNECT_FAILED
          fi

          # ── Gate 2: identity and production fingerprint ──────────────────────
          say ""
          say "## 1. Target identity (masked)"
          say ""
          say '```'
          q "select 'database' k, current_database() v
             union all select 'is_replica', pg_is_in_recovery()::text
             union all select 'server_addr_hash12', substr(md5(inet_server_addr()::text),1,12)
             union all select 'server_port', inet_server_port()::text
             union all select 'pg_version', (select setting from pg_settings where name='server_version')
             union all select 'pg_started', pg_postmaster_start_time()::text;"
          q "select name, setting from pg_settings where name like 'neon%' order by name limit 20;"
          say '```'
          say ""
          say "## 2. Data fingerprint"
          say ""
          say '```'
          q "select 'users' k, count(*)::text v from users
             union all select 'businesses', count(*)::text from businesses
             union all select 'bookings', count(*)::text from bookings
             union all select 'bot_starts', count(*)::text from bot_starts;"
          say '```'

          RECOVERY=$(qt "select pg_is_in_recovery();")
          USERS=$(qt "select count(*) from users;")
          HAS_TABLE=$(qt "select to_regclass('public.\"bot_starts\"') is not null;")
          if [ "$RECOVERY" != "f" ]; then
            say ""; say "**STOPPED: the target reports is_replica=$RECOVERY — refusing to write to a replica.**"; finish STOPPED_REPLICA
          fi
          if [ "$HAS_TABLE" != "t" ]; then
            say ""; say "**STOPPED: \`bot_starts\` is absent, so 0001 was never applied here.**"; finish STOPPED_NO_TABLE
          fi
          if [ "${USERS:-0}" = "0" ]; then
            say ""; say "**STOPPED: zero rows in \`users\` — this does not look like the production database.**"; finish STOPPED_NOT_PROD
          fi

          # Row-identity digest: proves afterwards that no row was altered.
          DIGEST_SQL="select count(*)::text || '|' || coalesce(md5(string_agg(id ||':'|| \"telegramId\" ||':'|| coalesce(\"startParam\",'-') ||':'|| coalesce(\"createdAt\"::text,'-'), ',' order by id)), 'empty') from bot_starts;"
          PRE=$(qt "$DIGEST_SQL")
          say ""
          say "pre-change row digest: \`${PRE}\`"

          # ── Gate 3: current 0006 state ───────────────────────────────────────
          say ""
          say "## 3. Migration 0006 state"
          say ""
          say '```'
          q "select 'updateId column' k, case when exists (select 1 from information_schema.columns
                where table_schema='public' and table_name='bot_starts' and column_name='updateId')
                then 'PRESENT' else 'MISSING' end v;"
          q "select indexname, case when indexdef ilike '%unique%' then 'UNIQUE' else 'non-unique' end
               from pg_indexes where schemaname='public' and tablename='bot_starts' order by 1;"
          say '```'

          HAS_COL=$(qt "select case when exists (select 1 from information_schema.columns
                where table_schema='public' and table_name='bot_starts' and column_name='updateId') then '1' else '0' end;")
          HAS_IDX=$(qt "select case when (select count(*) from pg_indexes where schemaname='public'
                and indexname in ('bot_starts_telegramId_startParam_key','bot_starts_telegramId_updateId_key')) = 2 then '1' else '0' end;")

          # ── Gate 4: duplicate rows ───────────────────────────────────────────
          DUP_SQL="select count(*) from (select 1 from bot_starts where \"startParam\" is not null
                     group by \"telegramId\",\"startParam\" having count(*) > 1) d;"
          DUPS=$(qt "$DUP_SQL")
          say ""
          say "duplicate (telegramId, startParam) groups: \`${DUPS}\`"

          STATE="NOT_APPLIED"
          [ "$HAS_COL" = "1" ] && [ "$HAS_IDX" = "1" ] && STATE="ALREADY_APPLIED"
          [ "$HAS_COL" = "1" ] && [ "$HAS_IDX" != "1" ] && STATE="PARTIAL"

          if [ "$STATE" != "ALREADY_APPLIED" ] && [ "${DUPS:-1}" != "0" ]; then
            say ""
            say "**STOPPED: ${DUPS} duplicate (telegramId, startParam) group(s) exist.** The migration aborts on"
            say "these by design and no row is deleted or merged automatically. An explicitly approved clean-up"
            say "is required first."
            finish STOPPED_DUPLICATES
          fi

          if [ "$MODE" != "apply" ]; then
            say ""
            say "## 4. verify-only: nothing was modified"
            say "state: \`$STATE\` · duplicates: \`$DUPS\`"
            [ "$STATE" = "ALREADY_APPLIED" ] && finish VERIFY_ONLY_APPLIED
            finish VERIFY_ONLY_PENDING
          fi
          if [ "$STATE" = "ALREADY_APPLIED" ]; then
            say ""
            say "## 4. Already applied — the migration is skipped, verification still runs"
          else
            # ── Gate 5: backup, then prove the backup restores ─────────────────
            say ""
            say "## 4. Backup and restore verification"
            say ""
            say '```'
            pg_dump --schema-only -f /tmp/backup-schema.sql 2>&1 | red | tee -a "$R"
            pg_dump --data-only --table=bot_starts -f /tmp/backup-bot_starts.sql 2>&1 | red | tee -a "$R"
            SRC_ROWS=$(qt "select count(*) from bot_starts;")
            echo "dumps: $(wc -c < /tmp/backup-schema.sql) B schema, $(wc -c < /tmp/backup-bot_starts.sql) B bot_starts data"
            echo "source bot_starts rows: $SRC_ROWS"
            echo "schema dump sha256: $(sha256sum /tmp/backup-schema.sql | cut -c1-16)…"
            say '```'
            cp /tmp/backup-schema.sql /tmp/artifact-schema.sql

            say ""
            say "### Restoring both dumps into a throwaway PostgreSQL inside this runner"
            say ""
            say '```'
            export PGDATA=/tmp/pgdata
            command -v initdb >/dev/null 2>&1 || sudo apt-get install -y -qq postgresql >/dev/null 2>&1 || true
            INITDB=$(ls /usr/lib/postgresql/*/bin/initdb 2>/dev/null | head -1); INITDB=${INITDB:-initdb}
            PGCTL=$(ls /usr/lib/postgresql/*/bin/pg_ctl 2>/dev/null | head -1); PGCTL=${PGCTL:-pg_ctl}
            rm -rf "$PGDATA"
            if "$INITDB" -D "$PGDATA" -U restorer >/dev/null 2>&1 \
               && "$PGCTL" -D "$PGDATA" -l /tmp/pglog -o "-p 55432 -k /tmp" start >/dev/null 2>&1; then
              sleep 3
              createdb -h /tmp -p 55432 -U restorer scratch
              psql -h /tmp -p 55432 -U restorer -d scratch -q -v ON_ERROR_STOP=1 -f /tmp/backup-schema.sql >/dev/null \
                && echo "schema restored: OK"
              psql -h /tmp -p 55432 -U restorer -d scratch -q -c "set session_replication_role = replica;" \
                   -f /tmp/backup-bot_starts.sql >/dev/null && echo "bot_starts data restored: OK"
              RESTORED_ROWS=$(psql -h /tmp -p 55432 -U restorer -d scratch -X -A -t -c "select count(*) from bot_starts;")
              echo "restored bot_starts rows: $RESTORED_ROWS"
              "$PGCTL" -D "$PGDATA" stop >/dev/null 2>&1 || true
              if [ "$RESTORED_ROWS" != "$SRC_ROWS" ]; then
                echo "BACKUP VERIFICATION FAILED — refusing to apply"
                say '```'; finish STOPPED_BACKUP
              fi
              echo "BACKUP VERIFIED: restorable and row count matches the source"
            else
              echo "no local PostgreSQL available for a restore test — refusing to apply"
              say '```'; finish STOPPED_BACKUP
            fi
            say '```'

            # ── The write. Guards are added to the runtime copy only. ──────────
            say ""
            say "## 5. Applying migration 0006"
            sed '0,/^BEGIN;$/s//BEGIN;\nSET LOCAL lock_timeout = 5000;\nSET LOCAL statement_timeout = 120000;/' \
              prisma/sql/0006_bot_starts_unique.sql > /tmp/0006_apply.sql
            say "runtime SQL: $(wc -l < prisma/sql/0006_bot_starts_unique.sql) lines committed → $(wc -l < /tmp/0006_apply.sql) lines executed (two SET LOCAL guards added)"
            say "runtime SQL sha256: \`$(sha256sum /tmp/0006_apply.sql | cut -c1-16)…\`"
            say ""
            say '```'
            psql -X -q -v ON_ERROR_STOP=1 -P pager=off -f /tmp/0006_apply.sql 2>&1 | red | tee -a "$R"
            RC=${PIPESTATUS[0]}
            echo "psql exit code: $RC"
            say '```'
            if [ "$RC" != "0" ]; then
              say ""
              say "**MIGRATION FAILED (exit $RC).** The file runs as one transaction, so the database is left"
              say "exactly as it was. Nothing is retried automatically."
              finish APPLY_FAILED
            fi
            STATE="APPLIED"
          fi

          # ── Verification, straight from the database ─────────────────────────
          say ""
          say "## 6. Verification against the live database"
          say ""
          say '```'
          q "select column_name, data_type, is_nullable, coalesce(column_default,'(none)') as default_value
               from information_schema.columns
              where table_schema='public' and table_name='bot_starts' and column_name='updateId';"
          q "select i.relname as index_name, ix.indisunique, ix.indisvalid, ix.indisready
               from pg_index ix join pg_class i on i.oid = ix.indexrelid
              where ix.indrelid = 'bot_starts'::regclass
                and i.relname in ('bot_starts_telegramId_startParam_key','bot_starts_telegramId_updateId_key')
              order by 1;"
          q "select 'duplicate groups (startParam)' k, count(*)::text v from (
                 select 1 from bot_starts where \"startParam\" is not null
                  group by \"telegramId\",\"startParam\" having count(*) > 1) d
             union all select 'duplicate groups (updateId)', count(*)::text from (
                 select 1 from bot_starts where \"updateId\" is not null
                  group by \"telegramId\",\"updateId\" having count(*) > 1) d2;"
          say '```'

          COL_OK=$(qt "select case when exists (select 1 from information_schema.columns
                     where table_schema='public' and table_name='bot_starts' and column_name='updateId'
                       and data_type='integer' and is_nullable='YES') then '1' else '0' end;")
          IDX_OK=$(qt "select case when (select count(*) from pg_index ix join pg_class i on i.oid=ix.indexrelid
                       where ix.indrelid='bot_starts'::regclass and ix.indisunique and ix.indisvalid and ix.indisready
                         and i.relname in ('bot_starts_telegramId_startParam_key','bot_starts_telegramId_updateId_key')) = 2
                     then '1' else '0' end;")
          DUP_AFTER=$(qt "$DUP_SQL")
          POST=$(qt "$DIGEST_SQL")
          say ""
          say "checks: column integer+nullable=\`$COL_OK\` · both unique indexes valid=\`$IDX_OK\` · duplicates=\`$DUP_AFTER\`"
          say "row digest before=\`${PRE}\` · after=\`${POST}\`"
          if [ "$COL_OK" != "1" ] || [ "$IDX_OK" != "1" ] || [ "${DUP_AFTER:-1}" != "0" ] || [ "$PRE" != "$POST" ]; then
            say ""
            say "**VERIFICATION FAILED.** See the checks above; the database does not match the expected 0006 state."
            finish VERIFY_FAILED
          fi
          say "**VERIFIED: column and both unique indexes are present and valid, and every row is untouched.**"

          # ── Application-level probe (Prisma, inside a rolled-back transaction)
          say ""
          say "## 7. Prisma probe (rolled back; no residue)"
          say ""
          say '```'
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 || npm install --no-audit --no-fund --ignore-scripts >/dev/null 2>&1
          PRISMA_OK=1; PRISMA_UNAVAILABLE=0
          if npx prisma generate >/dev/null 2>&1; then
            echo "prisma client generated"
            DATABASE_URL="$URL" node -e '
              const { PrismaClient } = require("@prisma/client");
              const p = new PrismaClient();
              (async () => {
                try {
                  const rows = await p.botStart.findMany({ take: 1, orderBy: { createdAt: "desc" } });
                  console.log("READ bot_starts incl. updateId: OK (" + rows.length + " row(s))");
                  await p.$transaction(async (tx) => {
                    const made = await tx.botStart.create({
                      data: { telegramId: "__probe__", startParam: "__probe_0006__", updateId: 1 },
                    });
                    console.log("CREATE inside transaction: OK (" + made.id + ")");
                    throw new Error("ROLLBACK_ON_PURPOSE");
                  });
                } catch (e) {
                  console.log("transaction outcome: " + String(e.message).split("\n")[0]);
                } finally { await p.disconnect ? await p.$disconnect() : null; }
              })();' > /tmp/prisma_probe.out 2>&1
            red < /tmp/prisma_probe.out | tee -a "$R"
            if grep -q "READ bot_starts incl. updateId: OK" /tmp/prisma_probe.out \
               && ! grep -qE "P2022|does not exist|Cannot find module" /tmp/prisma_probe.out; then
              echo "PRISMA PROBE PASSED: the query that used to fail on the missing column now succeeds"
            else
              echo "PRISMA PROBE FAILED — the application query path is not proven"
              PRISMA_OK=0
            fi
          else
            echo "prisma client could not be generated on this runner (engine download blocked) —"
            echo "the application query path cannot be proven here"
            PRISMA_OK=0; PRISMA_UNAVAILABLE=1
          fi
          printf '%s\n' \
            'BEGIN;' \
            'INSERT INTO "bot_starts" (id,"telegramId","startParam","updateId","wasExistingUser")' \
            '  VALUES ('"'"'__probeA_0006__'"'"','"'"'__probe__'"'"','"'"'__probe_0006__'"'"',1,false);' \
            "SELECT 'PASS: first /start-shaped write accepted' AS step1;" \
            'DO $$' \
            'BEGIN' \
            '  BEGIN' \
            '    INSERT INTO "bot_starts" (id,"telegramId","startParam","updateId","wasExistingUser")' \
            '      VALUES ('"'"'__probeB_0006__'"'"','"'"'__probe__'"'"','"'"'__probe_0006__'"'"',2,false);' \
            '    RAISE EXCEPTION '"'"'FAIL: duplicate accepted'"'"';' \
            '  EXCEPTION WHEN unique_violation THEN' \
            '    RAISE NOTICE '"'"'PASS: duplicate /start rejected by the unique index'"'"';' \
            '  END;' \
            'END $$;' \
            'ROLLBACK;' > /tmp/probe.sql
          psql -X -q -A -P pager=off -v ON_ERROR_STOP=1 -f /tmp/probe.sql 2>&1 | red | tee -a "$R"
          PROBE_RC=${PIPESTATUS[0]}
          LEFT=$(qt "select count(*) from bot_starts where \"telegramId\" = '__probe__';")
          echo "probe exit code: $PROBE_RC · residue rows: $LEFT (must be 0)"
          say '```'
          if [ "$PROBE_RC" != "0" ] || [ "${LEFT:-1}" != "0" ] || [ "$PRISMA_OK" != "1" ]; then
            say ""
            if [ "$PRISMA_UNAVAILABLE" = "1" ]; then
              say "**PROBE UNAVAILABLE.** The SQL-level state is verified, but the Prisma query path could not be"
              say "exercised on this runner, so this run does not claim the application path is fixed."
              finish PROBE_UNAVAILABLE
            fi
            say "**PROBE FAILED.** The application path is not proven end to end (prisma_ok=$PRISMA_OK, psql_rc=$PROBE_RC, residue=$LEFT)."
            finish PROBE_FAILED
          fi

          # ── Outreach switches: read-only, never touched ──────────────────────
          say ""
          say "## 8. Outreach switches (read-only; nothing was enabled)"
          say ""
          say '```'
          q "select key, value from admin_settings
              where key in ('outreach.enabled','outreach.auto_send_enabled') order by key;"
          q "select 'admin_settings rows with outreach.% key' k, count(*)::text v from admin_settings where key like 'outreach.%';"
          say '```'

          if [ "$STATE" = "APPLIED" ]; then finish VERIFIED; else finish ALREADY_APPLIED_VERIFIED; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-0006-schema-backup
          path: /tmp/artifact-schema.sql
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish findings
        if: always()
        run: |
          REPORT=$(cat /tmp/report.txt 2>/dev/null || echo "no findings collected")
          OUTCOME=$(cat /tmp/outcome 2>/dev/null || echo "NO_OUTCOME")
          {
            echo '{"name":"DB 0006 apply+verify","head_sha":"'"$GITHUB_SHA"'","status":"completed","conclusion":"neutral","output":'
            printf '%s' "$REPORT" | jq -Rs --arg o "$OUTCOME" '{title:("Bookora 0006 — outcome: " + $o), summary:.}'
            echo '}'
          } > /tmp/payload.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/payload.json >/dev/null && echo "check run published"

      - name: Enforce outcome (a gated run must fail unless it verified the database)
        if: always()
        run: |
          OUTCOME=$(cat /tmp/outcome 2>/dev/null || echo "NO_OUTCOME")
          case "$OUTCOME" in
            VERIFIED|ALREADY_APPLIED_VERIFIED|VERIFY_ONLY_APPLIED|VERIFY_ONLY_PENDING)
              echo "outcome $OUTCOME — run completed as intended"; exit 0 ;;
            *)
              echo "::error::0006 run ended as $OUTCOME — see the check-run summary for the exact reason"
              exit 1 ;;
          esac
