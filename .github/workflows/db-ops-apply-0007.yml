name: DB Ops — 0007 apply + verify (gated)

# Applies prisma/sql/0007_business_lifecycle_holidays.sql to the Production
# database and verifies the result directly against that database — but only
# when every gate passes. The run is never reported as successful unless the
# change was really made and really verified.
#
# Secret provenance (important): the `secrets.*` values referenced below are
# GitHub Actions repository/environment secrets, NOT Vercel environment
# variables. Vercel does not automatically forward its env to GitHub Actions.
# This workflow never prints any secret value, never asks for a value to be
# pasted, and never reads a value from Vercel.
#
#   mode=verify-only (default): read-only. Reports identity, a masked
#     fingerprint, and the 0007 structural state. Writes nothing, ever.
#   mode=apply : additionally requires confirm=APPLY-0007 AND trusted
#     fingerprint inputs, then takes a schema-only DDL dump, applies the
#     migration and verifies it.
#
# Gates before any write (fail-closed):
#   1. DIRECT_URL (or one fallback) is present and parses as postgres(s)://.
#   2. Credential connects; target is a primary; businesses table exists.
#   3. Trusted fingerprint inputs are provided AND match the live target
#      (database name, server hash prefix, users/businesses/bookings counts).
#   4. Pre-state is NOT_APPLIED or ALREADY_APPLIED per the structural checks
#      in prisma/sql/_ci_0007_state_check.sql; PARTIAL_OR_UNEXPECTED aborts.
#   5. Schema-only DDL dump is produced (DDL reference; NOT a data backup —
#      data recovery must use Neon PITR/branch).
#   6. The DDL runs in one transaction with lock/statement timeouts; any
#      failure aborts with ON_ERROR_STOP=1 and rolls back.
#   7. Post-apply structural checks all pass and table counts are unchanged.
#   8. Prisma probe: read lifecycle columns, create a holiday inside a
#      transaction, deliberately rollback, confirm zero residue.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify-only (read-only) or apply (apply 0007 after all gates pass)"
        type: choice
        options: [verify-only, apply]
        default: verify-only
        required: true
      confirm:
        description: 'Type exactly APPLY-0007 to permit mode=apply.'
        type: string
        default: ""
      expected_database:
        description: "(apply only) Expected current_database() from verify-only §1."
        required: false
        default: ""
      expected_server_hash12:
        description: "(apply only) Expected server_addr_hash12 (12 hex) from verify-only §1."
        required: false
        default: ""
      expected_users:
        description: "(apply only) Expected users row count from verify-only §2."
        required: false
        default: ""
      expected_businesses:
        description: "(apply only) Expected businesses row count from verify-only §2."
        required: false
        default: ""
      expected_bookings:
        description: "(apply only) Expected bookings row count from verify-only §2."
        required: false
        default: ""

concurrency:
  group: db-ops-0007
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  gated:
    name: gated 0007 operation
    runs-on: ubuntu-latest
    environment: Production
    env:
      C_DIRECT: ${{ secrets.DIRECT_URL }}
      C_DATABASE: ${{ secrets.DATABASE_URL }}
      C_POSTGRES: ${{ secrets.POSTGRES_URL }}
      C_NEON: ${{ secrets.NEON_DATABASE_URL }}
      C_PROD: ${{ secrets.PRODUCTION_DATABASE_URL }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      FP_DB: ${{ inputs.expected_database }}
      FP_HASH: ${{ inputs.expected_server_hash12 }}
      FP_USERS: ${{ inputs.expected_users }}
      FP_BIZ: ${{ inputs.expected_businesses }}
      FP_BK: ${{ inputs.expected_bookings }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Gated operation (read-only unless mode=apply and every gate passes)
        shell: bash {0}
        run: |
          set -euo pipefail
          R=/tmp/report.txt; : > "$R"
          OUT=/tmp/outcome; echo "PENDING" > "$OUT"

          say() { printf '%s\n' "$*" | tee -a "$R"; }
          # Redact host + any user:password + password= query string before
          # anything hits the report. All query/probe output is piped through.
          red() {
            sed -e "s|${PGHOST:-__no_host__}|[db-host]|g" \
                -e 's|://[^:/@]*:[^@]*@|://***:***@|g' \
                -e 's|password=[^&"'"'"' ]*|password=***|g'
          }
          finish() {
            echo "$1" > "$OUT"
            say ""
            say "**OUTCOME: \`$1\`**"
            exit 0
          }

          say "mode: \`$MODE\`"
          say "target migration: \`prisma/sql/0007_business_lifecycle_holidays.sql\`"
          say ""
          say "## 0. Secret provenance"
          say ""
          say "Credentials are read from GitHub Actions \`Production\` environment/repository secrets."
          say "Vercel environment variables are NOT accessible here. Values are never printed."

          # ── Gate 1: credential resolution + URL validation ────────────────
          DIRECT_SELECTED="${C_DIRECT:-}"
          DATABASE_SELECTED="${C_DATABASE:-}"
          # verify-only may read through any available postgres URL; apply
          # MUST have a direct/unpooled URL in DIRECT_URL (DDL + lock_timeout
          # + multi-statement transactions are not safe through a pooler).
          if [ "$MODE" = "apply" ]; then
            if [ -z "$DIRECT_SELECTED" ]; then
              say ""
              say "## BLOCKED — mode=apply requires secret DIRECT_URL (direct/unpooled)"
              say ""
              say "Fallback secrets (DATABASE_URL / POSTGRES_URL / NEON_DATABASE_URL /"
              say "PRODUCTION_DATABASE_URL) are accepted for verify-only reads but"
              say "must NOT be used for DDL because they may point at a pooled endpoint."
              finish NO_DIRECT_CREDENTIAL
            fi
            URL="$DIRECT_SELECTED"
          else
            URL="${DIRECT_SELECTED:-}"
            [ -n "$URL" ] || URL="${DATABASE_SELECTED:-}"
            [ -n "$URL" ] || URL="${C_POSTGRES:-}"
            [ -n "$URL" ] || URL="${C_NEON:-}"
            [ -n "$URL" ] || URL="${C_PROD:-}"
          fi
          if [ -z "$URL" ]; then
            say ""
            say "## BLOCKED — no database credential in GitHub Actions secrets"
            say ""
            say "Repository scope and environment \`Production\` were both checked."
            say "Nothing was connected to and nothing was modified."
            say ""
            say "Add a GitHub Actions secret named \`DIRECT_URL\` (Neon direct/unpooled) to the"
            say "\`Production\` environment or repository scope. Do NOT paste or print its value."
            finish NO_CREDENTIAL
          fi
          case "$URL" in
            postgres://*|postgresql://*) ;;
            *) say ""; say "## BLOCKED — selected credential is not postgres(s)://"; finish CREDENTIAL_BAD_SCHEME ;;
          esac
          # Prisma requires both DATABASE_URL and DIRECT_URL. If DATABASE_URL is
          # set separately and valid, honor it; otherwise feed the direct URL to
          # both vars. This is safe for the short probe (read + rolled-back tx).
          if [ -z "$DATABASE_SELECTED" ]; then
            PRISMA_DATABASE_URL="$URL"
          else
            case "$DATABASE_SELECTED" in
              postgres://*|postgresql://*) PRISMA_DATABASE_URL="$DATABASE_SELECTED" ;;
              *) say "## BLOCKED — DATABASE_URL secret is present but not a postgres URL"; finish CREDENTIAL_BAD_SCHEME ;;
            esac
          fi
          PRISMA_DIRECT_URL="$URL"
          say "credential: selected (DIRECT_URL first); Prisma probe will receive both DATABASE_URL and DIRECT_URL"

          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "APPLY-0007" ]; then
            say ""; say "## BLOCKED — mode=apply requires confirm=APPLY-0007"; finish APPLY_NOT_CONFIRMED
          fi

          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq postgresql-client >/dev/null; }

          __DBURL__="$URL" python3 - > /tmp/pg_env.sh <<'PY'
          import os, urllib.parse, shlex
          u = urllib.parse.urlparse(os.environ["__DBURL__"])
          vals = {
            "PGHOST": u.hostname or "",
            "PGPORT": str(u.port or 5432),
            "PGUSER": urllib.parse.unquote(u.username or ""),
            "PGPASSWORD": urllib.parse.unquote(u.password or ""),
            "PGDATABASE": (u.path or "/").lstrip("/"),
            "PGSSLMODE": "require",
          }
          for k, v in vals.items():
            print(f"export {k}={shlex.quote(v)}")
          PY
          # shellcheck disable=SC1091
          . /tmp/pg_env.sh
          say "credential: loaded into PG* variables (value never printed)"

          # Query helpers (all use -v ON_ERROR_STOP=1; failure calls finish).
          # qq <sql>  — run a SQL string, tee redacted output to the report.
          # qf <file> — run a SQL file, tee redacted output to the report.
          # qt <sql>  — run a SQL string, return scalar silently (no tee).
          qq() {
            set +e
            local out rc
            out=$(psql -X -q -A -F'|' -P pager=off -v ON_ERROR_STOP=1 -c "$1" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out" | red | tee -a "$R"
            if [ "$rc" -ne 0 ]; then
              say "query failed with exit code $rc; aborting before any write"
              finish QUERY_FAILED
            fi
          }
          qf() {
            set +e
            local out rc
            out=$(psql -X -q -A -F'|' -P pager=off -v ON_ERROR_STOP=1 -f "$1" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out" | red | tee -a "$R"
            if [ "$rc" -ne 0 ]; then
              say "query file $1 failed with exit code $rc; aborting"
              finish QUERY_FAILED
            fi
          }
          qt() {
            set +e
            local out rc
            out=$(psql -X -A -t -v ON_ERROR_STOP=1 -c "$1" 2>/dev/null)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              say "scalar query failed with exit code $rc; aborting before any write"
              finish QUERY_FAILED
            fi
            printf '%s' "$out"
          }
          _sanity=$(qt "select 1;")
          say "sanity select: OK"

          # ── Gate 2: identity + counts ────────────────────────────────────
          say ""
          say "## 1. Target identity (masked)"
          say ""
          say '```'
          qq "select 'database' k, current_database() v
              union all select 'is_replica', pg_is_in_recovery()::text
              union all select 'server_addr_hash12', substr(md5(inet_server_addr()::text),1,12)
              union all select 'server_port', inet_server_port()::text
              union all select 'pg_version', (select setting from pg_settings where name='server_version')
              union all select 'pg_started', pg_postmaster_start_time()::text;"
          qq "select name, setting from pg_settings where name like 'neon%' order by name limit 20;"
          say '```'
          say ""
          say "## 2. Data fingerprint (counts only)"
          say ""
          say '```'
          qq "select 'users' k, count(*)::text v from users
              union all select 'businesses', count(*) from businesses
              union all select 'bookings', count(*) from bookings;"
          say '```'

          RECOVERY=$(qt "select pg_is_in_recovery();")
          DB_NAME=$(qt  "select current_database();")
          SRV_HASH=$(qt "select substr(md5(inet_server_addr()::text),1,12);")
          USERS=$(qt    "select count(*) from users;")
          BIZ_CT=$(qt   "select count(*) from businesses;")
          BK_CT=$(qt    "select count(*) from bookings;")
          HAS_BIZ=$(qt  "select to_regclass('public.\"businesses\"') is not null;")

          if [ "$RECOVERY" != "f" ]; then
            say ""; say "**STOPPED: is_replica=$RECOVERY — refusing to write to a replica.**"; finish STOPPED_REPLICA
          fi
          if [ "$HAS_BIZ" != "t" ]; then
            say ""; say "**STOPPED: \`businesses\` is absent — not the Bookora database.**"; finish STOPPED_NO_TABLE
          fi

          # ── Gate 3: fingerprint (apply only) ─────────────────────────────
          if [ "$MODE" = "apply" ]; then
            say ""
            say "## 3. Trusted fingerprint gate"
            say ""
            missing=()
            [ -z "$FP_DB" ]   && missing+=("expected_database")
            [ -z "$FP_HASH" ] && missing+=("expected_server_hash12")
            [ -z "$FP_USERS" ] && missing+=("expected_users")
            [ -z "$FP_BIZ" ]  && missing+=("expected_businesses")
            [ -z "$FP_BK" ]   && missing+=("expected_bookings")
            if [ "${#missing[@]}" -gt 0 ]; then
              say "**STOPPED: trusted fingerprint missing: ${missing[*]}.**"
              say "Obtain all five from a prior verify-only run; do not invent values."
              finish STOPPED_NO_TRUSTED_FINGERPRINT
            fi
            say "\`database\`:           live=\`$DB_NAME\`   expected=\`$FP_DB\`"
            say "\`server_hash12\`:      live=\`$SRV_HASH\`  expected=\`$FP_HASH\`"
            say "\`users\` count:        live=\`$USERS\`     expected=\`$FP_USERS\`"
            say "\`businesses\` count:   live=\`$BIZ_CT\`    expected=\`$FP_BIZ\`"
            say "\`bookings\` count:     live=\`$BK_CT\`     expected=\`$FP_BK\`"
            mismatch=()
            [ "$DB_NAME"  = "$FP_DB" ]   || mismatch+=("database")
            [ "$SRV_HASH" = "$FP_HASH" ] || mismatch+=("server_hash12")
            [ "$USERS"    = "$FP_USERS" ] || mismatch+=("users count")
            [ "$BIZ_CT"   = "$FP_BIZ" ]  || mismatch+=("businesses count")
            [ "$BK_CT"    = "$FP_BK" ]   || mismatch+=("bookings count")
            if [ "${#mismatch[@]}" -gt 0 ]; then
              say ""; say "**STOPPED: fingerprint mismatch (${mismatch[*]}).**"; finish STOPPED_FINGERPRINT_MISMATCH
            fi
            say "all five fingerprint fields match."
          else
            say ""
            say "## 3. Trusted fingerprint (verify-only)"
            say ""
            say "Record these values for a future apply run:"
            say ""
            say "| Field | Value |"
            say "| --- | --- |"
            say "| expected_database | \`$DB_NAME\` |"
            say "| expected_server_hash12 | \`$SRV_HASH\` |"
            say "| expected_users | \`$USERS\` |"
            say "| expected_businesses | \`$BIZ_CT\` |"
            say "| expected_bookings | \`$BK_CT\` |"
          fi

          # ── Gate 4: structural state ─────────────────────────────────────
          say ""
          say "## 4. Migration 0007 state (before) — structural check"
          say ""
          say '```'
          STRUCT_BEFORE=$(psql -X -A -t -v ON_ERROR_STOP=1 -f prisma/sql/_ci_0007_state_check.sql 2>/dev/null)
          STRUCT_RC=$?
          if [ "$STRUCT_RC" -ne 0 ] || [ -z "$STRUCT_BEFORE" ]; then
            say "structural query failed or returned no rows; aborting"
            finish QUERY_FAILED
          fi
          printf '%s\n' "$STRUCT_BEFORE" | red | tee -a "$R"
          say '```'
          TOTAL_CHECKS=$(printf '%s\n' "$STRUCT_BEFORE" | wc -l)
          OK_COUNT=$(printf '%s\n' "$STRUCT_BEFORE" | awk -F'|' '$2=="OK"{c++} END{print c+0}')
          say ""
          say "structural checks before: \`$OK_COUNT/$TOTAL_CHECKS\`"
          STATE="NOT_APPLIED"
          if [ "$OK_COUNT" -eq "$TOTAL_CHECKS" ]; then
            STATE="ALREADY_APPLIED"
          elif [ "$OK_COUNT" -gt 0 ]; then
            STATE="PARTIAL_OR_UNEXPECTED"
          fi
          say "pre-state classification: \`$STATE\`"

          if [ "$MODE" = "apply" ] && [ "$STATE" = "PARTIAL_OR_UNEXPECTED" ]; then
            say ""
            say "**STOPPED: PARTIAL_OR_UNEXPECTED state.** Some objects exist but not with the expected"
            say "structure. Refusing to apply on top of a partial/modified schema."
            finish STOPPED_PARTIAL_OR_UNEXPECTED
          fi

          if [ "$MODE" != "apply" ]; then
            say ""
            say "## 5. verify-only: nothing was modified"
            say ""
            say "No row, no column, no index was changed."
            finish VERIFY_ONLY
          fi

          # ── Gate 5: schema-only DDL dump (apply only). NOT a data backup. ─
          say ""
          say "## 6. Schema-only DDL dump (reference artifact, NOT a data backup)"
          say ""
          say "This captures public-schema DDL only. Data recovery requires Neon PITR/branch."
          set +e
          pg_dump -s -n public -O -x --no-owner --no-privileges > /tmp/artifact-schema.sql 2>/tmp/pg_dump.err
          PGBK_RC=$?
          set -e
          if [ "$PGBK_RC" != "0" ]; then
            say "DDL dump failed (rc=$PGBK_RC); aborting. stderr (redacted):"
            red < /tmp/pg_dump.err | tee -a "$R"
            finish BACKUP_FAILED
          fi
          BK_SIZE=$(wc -c < /tmp/artifact-schema.sql)
          say "DDL dump: \`${BK_SIZE}\` bytes (artifact; never printed); sha256=\`$(sha256sum /tmp/artifact-schema.sql | cut -c1-16)…\`"

          if [ "$STATE" = "ALREADY_APPLIED" ]; then
            say ""
            say "## 7. already applied — skipping DDL"
          else
            # ── Apply 0007 ──────────────────────────────────────────────────
            say ""
            say "## 7. Applying migration 0007"
            say ""
            sed '0,/^BEGIN;$/s//BEGIN;\nSET LOCAL lock_timeout = 5000;\nSET LOCAL statement_timeout = 120000;/' \
              prisma/sql/0007_business_lifecycle_holidays.sql > /tmp/0007_apply.sql
            say "runtime SQL lines: $(wc -l < prisma/sql/0007_business_lifecycle_holidays.sql) → $(wc -l < /tmp/0007_apply.sql)"
            say "sha256: \`$(sha256sum /tmp/0007_apply.sql | cut -c1-16)…\`"
            say ""
            say '```'
            set +e
            psql -X -q -v ON_ERROR_STOP=1 -P pager=off -f /tmp/0007_apply.sql 2>&1 | red | tee -a "$R"
            RC=${PIPESTATUS[0]}
            set -e
            echo "psql exit code: $RC"
            say '```'
            if [ "$RC" != "0" ]; then
              say ""
              say "**MIGRATION FAILED (exit $RC).** Transactional DDL rolled back; nothing applied."
              finish APPLY_FAILED
            fi
            STATE="APPLIED"
          fi

          # ── Post-apply structural verification ───────────────────────────
          say ""
          say "## 8. Post-apply structural verification"
          say ""
          say '```'
          qf prisma/sql/_ci_0007_state_check.sql
          say '```'
          POST_OK=$(psql -X -A -t -v ON_ERROR_STOP=1 -f prisma/sql/_ci_0007_state_check.sql 2>/dev/null | awk -F'|' '$2=="OK"{c++} END{print c+0}')
          USERS_AF=$(qt "select count(*) from users;")
          BIZ_AF=$(qt   "select count(*) from businesses;")
          BK_AF=$(qt    "select count(*) from bookings;")

          say ""
          say "structural checks after: \`$POST_OK/$TOTAL_CHECKS\`"
          say "counts before→after: users \`$USERS\`→\`$USERS_AF\` · businesses \`$BIZ_CT\`→\`$BIZ_AF\` · bookings \`$BK_CT\`→\`$BK_AF\`"

          if [ "$POST_OK" -ne "$TOTAL_CHECKS" ] || [ "$USERS_AF" != "$USERS" ] || [ "$BIZ_AF" != "$BIZ_CT" ] || [ "$BK_AF" != "$BK_CT" ]; then
            say ""; say "**VERIFICATION FAILED.** End-state mismatch or counts drifted."; finish VERIFY_FAILED
          fi
          say "**VERIFIED: all $TOTAL_CHECKS structural checks pass; table counts unchanged.**"

          # ── Prisma probe ────────────────────────────────────────────────
          say ""
          say "## 9. Prisma probe (rolled back; no residue)"
          say ""
          # Resolve node's absolute path BEFORE running npm install, so npm's
          # node_modules/.bin shims cannot shadow the real node binary.
          NODE_BIN="$(command -v node || true)"
          say '```'
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 || npm install --no-audit --no-fund --ignore-scripts >/dev/null 2>&1
          PRISMA_OK=1; PRISMA_UNAVAILABLE=0
          if [ -z "$NODE_BIN" ]; then
            echo "prisma client could not be generated (no node)"
            PRISMA_OK=0; PRISMA_UNAVAILABLE=1
          elif npx prisma generate >/dev/null 2>&1; then
            echo "prisma client generated"
            # Run the node probe; capture exit code without letting set -e
            # abort the script when the probe deliberately exits non-zero.
            set +e
            DATABASE_URL="$PRISMA_DATABASE_URL" DIRECT_URL="$PRISMA_DIRECT_URL" "$NODE_BIN" -e '
              const { PrismaClient } = require("@prisma/client");
              const p = new PrismaClient();
              (async () => {
                const asserts = { read:false, created:false, rolledBack:false, residueZero:false };
                let err = null;
                try {
                  const biz = await p.business.findFirst({
                    where: { deletedAt: null },
                    select: { id: true, expiresAt: true, deletedAt: true, setupCompletedAt: true, creationKey: true },
                    orderBy: { createdAt: "asc" },
                  });
                  if (!biz) throw new Error("PROBE_PRECONDITION: no non-deleted business row");
                  console.log("READ lifecycle cols on business " + biz.id + ": expiresAt=" + biz.expiresAt + " deletedAt=" + biz.deletedAt + " setupCompletedAt=" + biz.setupCompletedAt + " creationKey=" + biz.creationKey);
                  asserts.read = true;
                  let created;
                  try {
                    await p.$transaction(async (tx) => {
                      created = await tx.holiday.create({
                        data: { businessId: biz.id, date: new Date("2099-01-01T00:00:00Z"), reason: "__probe_0007__" },
                      });
                      console.log("CREATE holiday inside tx: OK id=" + created.id);
                      asserts.created = true;
                      throw new Error("ROLLBACK_ON_PURPOSE");
                    });
                  } catch (e) {
                    if (e && e.message === "ROLLBACK_ON_PURPOSE") {
                      console.log("transaction threw ROLLBACK_ON_PURPOSE as expected");
                      asserts.rolledBack = true;
                    } else { throw e; }
                  }
                  if (!created || !created.id) throw new Error("PROBE: holiday create did not return an id");
                  const leftovers = await p.holiday.count({ where: { businessId: biz.id, reason: "__probe_0007__" } });
                  console.log("residue rows: " + leftovers);
                  if (leftovers === 0) {
                    asserts.residueZero = true;
                  } else {
                    throw new Error("PROBE: residue rows exist (" + leftovers + ")");
                  }
                } catch (e) {
                  err = e;
                  console.log("probe error: " + String(e && e.message ? e.message : e));
                } finally {
                  try { await p.$disconnect(); } catch (_) {}
                }
                console.log("PROBE_ASSERTS read=" + asserts.read + " created=" + asserts.created + " rolledBack=" + asserts.rolledBack + " residueZero=" + asserts.residueZero);
                process.exit(err ? 2 : (asserts.read && asserts.created && asserts.rolledBack && asserts.residueZero) ? 0 : 3);
              })();' > /tmp/prisma_probe.out 2>&1
            PROBE_RC=$?
            set -e
            red < /tmp/prisma_probe.out | tee -a "$R"
            case $PROBE_RC in
              0) echo "PRISMA PROBE PASSED: read, create, rolled back, zero residue" ;;
              2) echo "PRISMA PROBE FAILED: runtime error"; PRISMA_OK=0 ;;
              3) echo "PRISMA PROBE FAILED: required assertions did not all pass"; PRISMA_OK=0 ;;
              *) echo "PRISMA PROBE FAILED: unexpected exit code $PROBE_RC"; PRISMA_OK=0 ;;
            esac
          else
            echo "prisma client could not be generated on this runner (engine download blocked)"
            PRISMA_OK=0; PRISMA_UNAVAILABLE=1
          fi
          echo '```'
          if [ "$PRISMA_UNAVAILABLE" = "1" ]; then
            say ""; say "**PROBE UNAVAILABLE.** Prisma engine blocked on this runner."; finish PROBE_UNAVAILABLE
          fi
          if [ "$PRISMA_OK" != "1" ]; then
            say ""; say "**PROBE FAILED.** Application path not proven end to end."; finish PROBE_FAILED
          fi

          say ""
          say "## 10. Outreach switches (read-only; not changed)"
          say ""
          say '```'
          qq "select key, value from admin_settings
               where key in ('outreach.enabled','outreach.auto_send_enabled') order by key;"
          say '```'

          if [ "$STATE" = "APPLIED" ]; then finish VERIFIED; else finish ALREADY_APPLIED_VERIFIED; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-0007-schema-backup
          path: /tmp/artifact-schema.sql
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish findings
        if: always()
        run: |
          REPORT=$(cat /tmp/report.txt 2>/dev/null || echo "no findings collected")
          OUTCOME=$(cat /tmp/outcome 2>/dev/null || echo "NO_OUTCOME")
          {
            echo '{"name":"DB 0007 apply+verify","head_sha":"'"$GITHUB_SHA"'","status":"completed","conclusion":"neutral","output":'
            printf '%s' "$REPORT" | jq -Rs --arg o "$OUTCOME" '{title:("Bookora 0007 — outcome: " + $o), summary:.}'
            echo '}'
          } > /tmp/payload.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/payload.json >/dev/null && echo "check run published"

      - name: Enforce outcome
        if: always()
        run: |
          OUTCOME=$(cat /tmp/outcome 2>/dev/null || echo "NO_OUTCOME")
          case "$OUTCOME" in
            VERIFIED|ALREADY_APPLIED_VERIFIED|VERIFY_ONLY)
              echo "outcome $OUTCOME"; exit 0 ;;
            *)
              echo "::error::0007 run ended as $OUTCOME"
              exit 1 ;;
          esac
